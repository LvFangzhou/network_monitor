version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: nm-postgres
    environment:
      POSTGRES_USER: network_monitor
      POSTGRES_PASSWORD: network_monitor
      POSTGRES_DB: network_monitor
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor
    restart: unless-stopped

  # InfluxDB2 时序数据库
  influxdb:
    image: influxdb:2.7
    container_name: nm-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: network-monitor
      DOCKER_INFLUXDB_INIT_BUCKET: network_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: network-monitor-token
    volumes:
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/var/lib/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor
    restart: unless-stopped

  # InfluxDB 每日备份，避免时序数据目录误删后完全不可恢复
  influxdb-backup:
    image: influxdb:2.7
    container_name: nm-influxdb-backup
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: network-monitor-token
      INFLUXDB_ORG: network-monitor
      INFLUXDB_BACKUP_RETENTION_DAYS: 10
    volumes:
      - ${BACKUP_ROOT:-./data/backups}/influxdb:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          recent=$$(find /backups -maxdepth 1 -type d -name 'influxdb-*' -mmin -1200 -print -quit)
          if [ -n "$${recent}" ]; then
            echo "Recent InfluxDB backup exists: $${recent}; checking again in one hour"
            sleep 3600
            continue
          fi
          ts=$$(date +%Y%m%d%H%M%S)
          target="/backups/influxdb-$${ts}"
          echo "Starting InfluxDB backup to $${target}"
          if influx backup "$${target}" --host "$${INFLUXDB_URL}" --token "$${INFLUXDB_TOKEN}" --org "$${INFLUXDB_ORG}"; then
            echo "InfluxDB backup completed: $${target}"
            find /backups -maxdepth 1 -type d -name 'influxdb-*' -mtime +"$${INFLUXDB_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
          else
            echo "InfluxDB backup failed" >&2
          fi
          sleep 86400
        done
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - network-monitor
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: nm-redis
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${DATA_ROOT:-./data}/rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor
    restart: unless-stopped

  # FastAPI 后端服务
  api:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-api
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - SNMP_TRAP_ENABLED=true
      - SNMP_TRAP_LISTEN_HOST=0.0.0.0
      - SNMP_TRAP_LISTEN_PORT=1162
      - FLOW_ENABLED=true
      - FLOW_LISTEN_HOST=0.0.0.0
      - FLOW_NETFLOW_PORT=2055
      - FLOW_SFLOW_PORT=6343
      - FLOW_FLUSH_INTERVAL_SECONDS=10
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=160
      - SNMP_INTERFACE_REALTIME_MAX_WORKERS=12
      - ASTERNOS_SCHEDULER_INTERVAL_SECONDS=30
      - ASTERNOS_FULL_COLLECTION_INTERVAL_SECONDS=120
      - ASTERNOS_MAX_DEVICES_PER_TICK=20
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"
      - "5514:5514/udp"
      - "162:1162/udp"
      - "2055:2055/udp"
      - "6343:6343/udp"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - network-monitor
    restart: unless-stopped

  # Celery Beat 定时任务调度
  celery-beat:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-beat
    command: celery -A app.tasks beat -l info
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=160
      - SNMP_INTERFACE_REALTIME_MAX_WORKERS=12
      - ASTERNOS_SCHEDULER_INTERVAL_SECONDS=30
      - ASTERNOS_FULL_COLLECTION_INTERVAL_SECONDS=120
      - ASTERNOS_MAX_DEVICES_PER_TICK=20
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped

  # Celery Worker 任务执行
  celery-worker: &celery-worker-base
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-worker
    command: celery -A app.tasks worker -l info -Q celery,default,tacacs -n worker-background@%h --pool=prefork -c 3 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=80 --max-memory-per-child=450000
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=160
      - SNMP_INTERFACE_REALTIME_MAX_WORKERS=12
      - ASTERNOS_SCHEDULER_INTERVAL_SECONDS=30
      - ASTERNOS_FULL_COLLECTION_INTERVAL_SECONDS=120
      - ASTERNOS_MAX_DEVICES_PER_TICK=20
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # 机器人通知独立队列，通知积压不再影响采集、告警计算和页面缓存任务
  celery-worker-notification:
    <<: *celery-worker-base
    container_name: nm-celery-worker-notification
    command: celery -A app.tasks worker -l info -Q notification -n worker-notification@%h --pool=threads -c 8 --prefetch-multiplier=1 -Ofair
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # 配置备份独立队列：SSH/Netmiko/Paramiko 长耗时任务不再挤占告警和页面缓存
  celery-worker-config-backup:
    <<: *celery-worker-base
    container_name: nm-celery-worker-config-backup
    command: celery -A app.tasks worker -l info -Q config_backup -n worker-config-backup@%h --pool=prefork -c 1 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=10 --max-memory-per-child=900000
    cpu_shares: 512
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CONFIG_BACKUP_CONCURRENCY=40
      - CONFIG_BACKUP_WAIT_TIMEOUT_SECONDS=1
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # 告警全量规则独立队列：慢规则不再拖住协议/健康告警
  celery-worker-alerts-general:
    <<: *celery-worker-base
    container_name: nm-celery-worker-alerts-general
    command: celery -A app.tasks worker -l info -Q alerts_general -n worker-alerts-general@%h --pool=prefork -c 2 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=80 --max-memory-per-child=600000
    cpu_shares: 768
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  # 协议邻居告警独立队列：BGP/OSPF 状态异常不被全量规则阻塞
  celery-worker-alerts-protocol:
    <<: *celery-worker-base
    container_name: nm-celery-worker-alerts-protocol
    command: celery -A app.tasks worker -l info -Q alerts_protocol -n worker-alerts-protocol@%h --pool=prefork -c 2 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=80 --max-memory-per-child=600000
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  # 设备健康告警独立队列：Ping/SNMP/Exporter/基础健康告警优先保障
  celery-worker-alerts-health:
    <<: *celery-worker-base
    container_name: nm-celery-worker-alerts-health
    command: celery -A app.tasks worker -l info -Q alerts_health -n worker-alerts-health@%h --pool=prefork -c 2 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=80 --max-memory-per-child=600000
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  # 接口快速告警独立队列：接口 AdminUp/物理Down 不再占用 SNMP 采集 worker
  celery-worker-alerts-fast:
    <<: *celery-worker-base
    container_name: nm-celery-worker-alerts-fast
    command: celery -A app.tasks worker -l info -Q alerts_fast -n worker-alerts-fast@%h --pool=prefork -c 1 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=40 --max-memory-per-child=700000
    cpu_shares: 1536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # 告警详情缓存预热独立低优先队列，不再影响实时告警检查
  celery-worker-alerts-prewarm:
    <<: *celery-worker-base
    container_name: nm-celery-worker-alerts-prewarm
    command: celery -A app.tasks worker -l info -Q alerts_prewarm -n worker-alerts-prewarm@%h --pool=threads -c 2 --prefetch-multiplier=1 -Ofair
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # 系统缓存/菜单预热独立队列，避免慢预热任务占用普通后台 worker
  celery-worker-system:
    <<: *celery-worker-base
    container_name: nm-celery-worker-system
    command: celery -A app.tasks worker -l info -Q system -n worker-system@%h --pool=threads -c 4 --prefetch-multiplier=1 -Ofair
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # 资源统计独立队列：线路/资源类定时任务与配置备份分离
  celery-worker-resource:
    <<: *celery-worker-base
    container_name: nm-celery-worker-resource
    command: celery -A app.tasks worker -l info -Q resource -n worker-resource@%h --pool=threads -c 3 --prefetch-multiplier=1 -Ofair
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # Celery Worker Asteros Exporter 独立采集，避免与告警/Tacacs/资源任务互相挤占
  celery-worker-asternos:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-worker-asternos
    command: celery -A app.tasks worker -l info -Q asternos -n worker-asternos@%h --pool=threads -c 16 --prefetch-multiplier=1 -Ofair
    cpu_shares: 4096
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=40
      - ASTERNOS_SCHEDULER_INTERVAL_SECONDS=30
      - ASTERNOS_FULL_COLLECTION_INTERVAL_SECONDS=120
      - ASTERNOS_MAX_DEVICES_PER_TICK=40
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 2G

  # Celery Worker Asteros 高频实时采集，与全量 Exporter 采集分离，减少互相抢占
  celery-worker-asternos-realtime:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-worker-asternos-realtime
    command: celery -A app.tasks worker -l info -Q asternos_realtime -n worker-asternos-realtime@%h --pool=threads -c 16 --prefetch-multiplier=1 -Ofair
    cpu_shares: 4096
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=40
      - ASTERNOS_SCHEDULER_INTERVAL_SECONDS=30
      - ASTERNOS_FULL_COLLECTION_INTERVAL_SECONDS=120
      - ASTERNOS_MAX_DEVICES_PER_TICK=40
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G

  # Celery Worker 高频 SNMP 采集
  celery-worker-snmp:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-worker-snmp
    command: celery -A app.tasks worker -l info -Q snmp_realtime -n worker-snmp@%h --pool=threads -c 24 --prefetch-multiplier=1 -Ofair
    cpu_shares: 4096
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_MAX_DEVICES_PER_TICK=80
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 2G

  # Celery Worker 线路绑定端口 10 秒级采集
  celery-worker-snmp-circuit:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-celery-worker-snmp-circuit
    command: celery -A app.tasks worker -l info -Q snmp_circuit_realtime,snmp_interface_realtime -n worker-snmp-circuit@%h --pool=threads -c 24 --prefetch-multiplier=1 -Ofair
    cpu_shares: 8192
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://172.18.17.250:8080}
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=30
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=300
      - SNMP_INTERFACE_REALTIME_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=160
      - SNMP_INTERFACE_REALTIME_MAX_WORKERS=20
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${TACACS_DATA_ROOT:-./data/tacacs}:/app/data/tacacs
      - ${INFLUXDB_DATA_ROOT:-./data/influxdb}:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 3G


  # Telemetry gRPC Dial-out 接收探针
  telemetry-receiver:
    build: ./backend
    image: network_monitor-backend:latest
    container_name: nm-telemetry-receiver
    command: python -m app.services.telemetry_receiver --host 0.0.0.0 --port 50051
    environment:
      - LOG_LEVEL=INFO
      - TELEMETRY_RECEIVER_PORT=50051
      - TELEMETRY_RECEIVER_SPOOL_DIR=/app/data/telemetry
      - TELEMETRY_RECEIVER_MAX_WORKERS=16
      - TELEMETRY_RECEIVER_LOG_EVERY=100
    volumes:
      - ./backend/app:/app/app
      - ${DATA_ROOT:-./data}/telemetry:/app/data/telemetry
    ports:
      - "50051:50051"
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # 前端 Web 应用
  frontend:
    build: ./frontend
    container_name: nm-frontend
    ports:
      - "10086:80"
      - "40086:443"
    depends_on:
      - api
    networks:
      - network-monitor
    restart: unless-stopped

  # TACACS+ 认证与命令审计服务
  tacacs:
    build: ./tacacs
    image: my_build_tacacs:latest
    container_name: nm-tacacs
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${TACACS_DATA_ROOT:-./data/tacacs}/tac_plus.cfg:/etc/tacacs+/tac_plus.cfg:ro
      - ${TACACS_DATA_ROOT:-./data/tacacs}/logs:/var/log/tacacs+
    environment:
      - TZ=UTC
    command: ["/usr/local/sbin/tac_plus", "-C", "/etc/tacacs+/tac_plus.cfg", "-G", "-l", "/var/log/tacacs+/tacacs.log"]

  # Nginx 反向代理（可选，用于高级配置）
  # nginx:
  #   image: nginx:alpine
  #   container_name: nm-nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - network-monitor
  #   restart: unless-stopped

networks:
  network-monitor:
    driver: bridge
    driver_opts:
      # 云主机物理网卡 MTU 为 1442，业务还需穿过 OpenVPN；预留隧道封装空间，避免 TLS/大响应分片黑洞。
      com.docker.network.driver.mtu: "1200"
