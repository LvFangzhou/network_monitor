version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: nm-postgres
    environment:
      POSTGRES_USER: network_monitor
      POSTGRES_PASSWORD: network_monitor
      POSTGRES_DB: network_monitor
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor

  # InfluxDB2 时序数据库
  influxdb:
    image: influxdb:2.7
    container_name: nm-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123456
      DOCKER_INFLUXDB_INIT_ORG: network-monitor
      DOCKER_INFLUXDB_INIT_BUCKET: network_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: network-monitor-token
    volumes:
      - ${DATA_ROOT:-./data}/influxdb:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor

  # InfluxDB 每日备份，避免时序数据目录误删后完全不可恢复
  influxdb-backup:
    image: influxdb:2.7
    container_name: nm-influxdb-backup
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: network-monitor-token
      INFLUXDB_ORG: network-monitor
      INFLUXDB_BACKUP_RETENTION_DAYS: 10
    volumes:
      - ${BACKUP_ROOT:-./data/backups}/influxdb:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          ts=$$(date +%Y%m%d%H%M%S)
          target="/backups/influxdb-$${ts}"
          echo "Starting InfluxDB backup to $${target}"
          if influx backup "$${target}" --host "$${INFLUXDB_URL}" --token "$${INFLUXDB_TOKEN}" --org "$${INFLUXDB_ORG}"; then
            echo "InfluxDB backup completed: $${target}"
            find /backups -maxdepth 1 -type d -name 'influxdb-*' -mtime +"$${INFLUXDB_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
          else
            echo "InfluxDB backup failed" >&2
          fi
          sleep 86400
        done
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - network-monitor
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: nm-redis
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ${DATA_ROOT:-./data}/rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network-monitor

  # FastAPI 后端服务
  api:
    build: ./backend
    container_name: nm-api
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=http://172.18.16.92:8080
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - FLOW_ENABLED=true
      - FLOW_LISTEN_HOST=0.0.0.0
      - FLOW_NETFLOW_PORT=2055
      - FLOW_SFLOW_PORT=6343
      - FLOW_FLUSH_INTERVAL_SECONDS=10
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=10
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=100
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./backend/app:/app/app
      - ${DATA_ROOT:-./data}/tacacs:/app/data/tacacs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
      - "5514:5514/udp"
      - "2055:2055/udp"
      - "6343:6343/udp"
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - network-monitor
    restart: unless-stopped

  # Celery Beat 定时任务调度
  celery-beat:
    build: ./backend
    container_name: nm-celery-beat
    command: celery -A app.tasks beat -l info
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=http://172.18.16.92:8080
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=10
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=100
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${DATA_ROOT:-./data}/tacacs:/app/data/tacacs
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped

  # Celery Worker 任务执行
  celery-worker:
    build: ./backend
    container_name: nm-celery-worker
    command: celery -A app.tasks worker -l info -Q celery,default,alerts,asternos,asternos_realtime,tacacs,resource,system -n worker-background@%h --pool=prefork -c 4 --prefetch-multiplier=1 -Ofair --max-tasks-per-child=80 --max-memory-per-child=450000
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=http://172.18.16.92:8080
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=10
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=100
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${DATA_ROOT:-./data}/tacacs:/app/data/tacacs
      - ${DATA_ROOT:-./data}/influxdb:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Celery Worker 高频 SNMP 采集
  celery-worker-snmp:
    build: ./backend
    container_name: nm-celery-worker-snmp
    command: celery -A app.tasks worker -l info -Q snmp_realtime -n worker-snmp@%h --pool=threads -c 24 --prefetch-multiplier=1 -Ofair
    environment:
      - DEBUG=false
      - SECRET_KEY=your-secret-key-change-in-production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=network_monitor
      - POSTGRES_PASSWORD=network_monitor
      - POSTGRES_DB=network_monitor
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=network-monitor-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network_metrics
      - INFLUXDB_RETENTION_DAYS=30
      - INFLUXDB_DATA_PATH=/host-data/influxdb
      - FRONTEND_PUBLIC_URL=http://172.18.16.92:8080
      - TACACS_WEBHOOK_URL=${TACACS_WEBHOOK_URL:-}
      - SYSTEM_ALERT_WEBHOOK_URL=${SYSTEM_ALERT_WEBHOOK_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SNMP_SCHEDULER_INTERVAL_SECONDS=10
      - SNMP_FULL_COLLECTION_INTERVAL_SECONDS=60
      - SNMP_MAX_DEVICES_PER_TICK=100
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - ${DATA_ROOT:-./data}/tacacs:/app/data/tacacs
      - ${DATA_ROOT:-./data}/influxdb:/host-data/influxdb:ro
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - influxdb
    networks:
      - network-monitor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 2G

  # 前端 Web 应用
  frontend:
    build: ./frontend
    container_name: nm-frontend
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
    networks:
      - network-monitor
    restart: unless-stopped

  # TACACS+ 认证与命令审计服务
  tacacs:
    build: ./tacacs
    image: my_build_tacacs:latest
    container_name: nm-tacacs
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_ROOT:-./data}/tacacs/tac_plus.cfg:/etc/tacacs+/tac_plus.cfg:ro
      - ${DATA_ROOT:-./data}/tacacs/logs:/var/log/tacacs+
    environment:
      - TZ=UTC
    command: ["/usr/local/sbin/tac_plus", "-C", "/etc/tacacs+/tac_plus.cfg", "-G", "-d", "2", "-l", "/var/log/tacacs+/tacacs.log"]

  # Nginx 反向代理（可选，用于高级配置）
  # nginx:
  #   image: nginx:alpine
  #   container_name: nm-nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - network-monitor
  #   restart: unless-stopped

networks:
  network-monitor:
    driver: bridge
